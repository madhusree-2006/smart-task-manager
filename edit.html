<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Task · Smart Task Manager</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="container narrow">
    <header class="hero"><div><p class="eyebrow">TASK DETAILS</p><h1>Edit task</h1><p class="subtitle">Update the task details below.</p></div></header>
    <section class="panel">
      <form method="post" class="edit-form">
        <label>Task title<input name="title" maxlength="120" value="{{ task.title }}" required></label>
        <label>Description<input name="description" maxlength="300" value="{{ task.description }}"></label>
        <label>Due date<input name="due_date" type="date" value="{{ task.due_date }}"></label>
        <label>Priority
          <select name="priority">
            <option value="Low" {% if task.priority == 'Low' %}selected{% endif %}>Low</option>
            <option value="Medium" {% if task.priority == 'Medium' %}selected{% endif %}>Medium</option>
            <option value="High" {% if task.priority == 'High' %}selected{% endif %}>High</option>
          </select>
        </label>
        <div class="form-actions"><button class="primary" type="submit">Save changes</button><a href="{{ url_for('index') }}">Cancel</a></div>
      </form>
    </section>
  </main>
</body>
</html>
